{% extends "base_app.html" %}
{% block title %}{{ titulo }} · Nexum{% endblock %}
{% block page_title %}{{ titulo }}{% endblock %}

{% block page %}
<div class="flex max-w-3xl flex-col items-center justify-center rounded-2xl border border-dashed border-line bg-surface px-6 py-16 text-center">
  <span class="flex h-14 w-14 items-center justify-center rounded-full bg-primary-soft text-primary-text ring-8 ring-primary-soft/50 [&_svg]:h-6 [&_svg]:w-6">
    {% include "partials/icone_engrenagem.html" %}
  </span>
  <h2 class="mt-5 text-lg font-semibold">{{ titulo }}</h2>
  <p class="mt-2 max-w-md text-sm text-ink-soft">{{ descricao }}</p>
  <p class="mt-4 rounded-full bg-page px-3 py-1 text-xs font-medium text-ink-soft">Em construção</p>
</div>
{% endblock %}
