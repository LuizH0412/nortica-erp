{% if campo.field.widget.input_type == "checkbox" %}
<label class="flex items-start gap-3">
  {{ campo }}
  <span>
    <span class="block text-sm font-medium">{{ campo.label }}</span>
    {% if campo.help_text %}<span class="block text-xs text-ink-soft">{{ campo.help_text }}</span>{% endif %}
  </span>
</label>
{% else %}
<div>
  <label for="{{ campo.id_for_label }}" class="block text-sm font-medium">{{ campo.label }}</label>
  {{ campo }}
  {% if campo.help_text %}<div class="mt-1 text-xs text-ink-soft">{{ campo.help_text }}</div>{% endif %}
</div>
{% endif %}
{% for erro in campo.errors %}
<p class="mt-1 text-xs text-danger">{{ erro }}</p>
{% endfor %}
